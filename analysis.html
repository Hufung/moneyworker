<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FundSprint | Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style-new.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="layout">
      <nav class="top-nav" aria-label="頁面導覽">
        <a class="nav-link" href="index.html">主控台</a>
        <a class="nav-link is-active" href="analysis.html">分析頁</a>
        <a class="nav-link" href="expenses.html">支出頁</a>
        <a class="nav-link" href="settings.html">設定頁</a>
      </nav>

      <header class="hero reveal">
        <h1>資金解鎖分析</h1>
        <p class="hero-copy">
          主頁已精簡；進度條與智慧提醒集中在此頁，方便專注查看狀態趨勢。
        </p>
      </header>

      <section class="summary reveal" aria-label="資金總覽">
        <article class="stat-card accent-a">
          <h2>現有預算</h2>
          <p id="budgetValue">NT$0.00</p>
          <small>已扣除支出</small>
        </article>

        <article class="stat-card accent-b">
          <h2>可用資金</h2>
          <p id="unlockedEverValue">NT$0.00</p>
          <small>完成過就保留</small>
        </article>

        <article class="stat-card accent-b">
          <h2>收入</h2>
          <p id="incomeValue">NT$0.00</p>
          <small>手動新增收入</small>
        </article>

        <article class="stat-card accent-c">
          <h2>已支出</h2>
          <p id="spentValue">NT$0.00</p>
          <small>已記錄支出合計</small>
        </article>

        <article class="stat-card accent-d">
          <h2>目前可用</h2>
          <p id="availableValue">NT$0.00</p>
          <small id="statusNote">可新增支出</small>
        </article>
      </section>

      <section class="meter-row reveal" aria-label="進度條">
        <div class="meter">
          <div class="meter-head">
            <h3>預算解鎖進度</h3>
            <span id="unlockProgressText">0%</span>
          </div>
          <div class="meter-track">
            <div id="unlockProgressFill" class="meter-fill"></div>
          </div>
        </div>

        <div class="meter">
          <div class="meter-head">
            <h3>可用額度使用率</h3>
            <span id="spendProgressText">0%</span>
          </div>
          <div class="meter-track">
            <div id="spendProgressFill" class="meter-fill warning"></div>
          </div>
        </div>
      </section>

      <section class="insight reveal" aria-label="即時建議">
        <article class="insight-card">
          <h3>智慧提醒</h3>
          <p id="coachMessage">先設定總預算，接著新增第一筆待辦來解鎖資金。</p>
        </article>

        <article class="insight-card">
          <h3>下一步可解鎖</h3>
          <p id="nextUnlockValue">NT$0.00</p>
        </article>
      </section>

      <section class="page-links reveal" aria-label="下一步操作">
        <a class="page-card" href="expenses.html">
          <h3>前往支出頁</h3>
          <p>依照可用額度新增支出，並用分類與排序快速檢視。</p>
        </a>
        <a class="page-card" href="settings.html">
          <h3>前往設定頁</h3>
          <p>進行備份匯出、匯入或重置資料。</p>
        </a>
      </section>

      <div id="messageBar" class="message" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
